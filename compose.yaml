# The mcp-adapter (:8123) and its optional redis. The frontend is not in
# Docker on this branch: it runs with `npm run dev` (see README.md), and
# Vite proxies /sessions + /{sessionId}/mcp to :8123.
#
# REDIS LIFECYCLE — start it once, then leave it alone:
#   docker compose --profile redis up -d
# redis runs on the "redis" profile, so every later plain command only
# manages server — iterate, rebuild, even `down`, and redis (plus its
# volume of session data) keeps running:
#   docker compose up -d --build server
#   docker compose down        # <- redis survives this too
# To stop redis as well:  docker compose --profile redis down
#
# REDIS_URL is always set on server; the adapter probes redis at startup
# and falls back to the in-memory store when it isn't there.
services:
  server:
    build: ./mcp-adapter
    ports:
      - "8123:8123"
    environment:
      SESSION_GRACE_SECONDS: "60"
      CALL_TIMEOUT_SECONDS: "60"
      LOG_LEVEL: info
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
        required: false # absent when the profile is off: probe + fallback

  # Disabled: the UMAP frontend links @bioturing-org/ai2ui from a local
  # checkout and needs the private @bioturing registry, so no image builds
  # from this repo alone. The old Dockerfile + nginx.conf built the counter
  # demo and were removed with it.
  # frontend:
  #   build:
  #     context: .
  #     dockerfile: frontend/Dockerfile
  #   ports:
  #     - "8080:80"
  #   depends_on:
  #     - server

  redis:
    image: redis:8-alpine
    profiles: ["redis"]
    # appendonly + a named volume: even a redis restart keeps session state.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  redis-data:
