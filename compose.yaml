# FE <-> mcp-adapter stack on ONE origin: http://localhost:8080 serves the
# UI and nginx proxies /sessions + /{sessionId}/mcp to the adapter, so
# browsers (and MCP clients) only ever need :8080 — important when the UI
# is reached through tunnels or forwarded ports. :8123 stays published for
# direct adapter access.
#
# REDIS LIFECYCLE — start it once, then leave it alone:
#   docker compose --profile redis up -d
# redis runs on the "redis" profile, so every later plain command only
# manages server+frontend — iterate, rebuild, even `down`, and redis (plus
# its volume of session data) keeps running:
#   docker compose up -d --build server frontend
#   docker compose down        # <- redis survives this too
# To stop redis as well:  docker compose --profile redis down
#
# REDIS_URL is always set on server; the adapter probes redis at startup
# and falls back to the in-memory store when it isn't there.
services:
  server:
    build: ./mcp-adapter
    ports:
      - "8123:8123"
    environment:
      SESSION_GRACE_SECONDS: "60"
      CALL_TIMEOUT_SECONDS: "60"
      LOG_LEVEL: info
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
        required: false # absent when the profile is off: probe + fallback

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - server

  redis:
    image: redis:8-alpine
    profiles: ["redis"]
    # appendonly + a named volume: even a redis restart keeps session state.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  redis-data:
