# Serves the built UI and proxies the mcp-adapter endpoints, keeping the
# whole stack on one origin: the browser never needs :8123 reachable, which
# matters when the UI itself is reached through tunnels or forwarded ports.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip off; # never buffer-encoding an SSE stream

    location / {
        try_files $uri $uri/ =404;
    }

    # Session handshake / stream / messages / close.
    location /sessions {
        proxy_pass http://server:8123;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host; # keep the port; mcpUrl derives from Host
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # Per-session public surfaces: MCP endpoint, docs page, its tools feed.
    location ~ ^/sess_[0-9A-Za-z]+/(mcp|docs|api/tools|favicon\.svg|mcp/docs|mcp/api/tools|mcp/favicon\.svg)$ {
        proxy_pass http://server:8123;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host; # keep the port; mcpUrl derives from Host
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }
}
