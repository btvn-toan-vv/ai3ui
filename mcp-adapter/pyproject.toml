[project]
name = "mcp-adapter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.9",
    "fastmcp-docs>=1.0.0",
    "redis>=8.1.0",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_adapter"]

[tool.ruff]
line-length = 100
target-version = "py312"
